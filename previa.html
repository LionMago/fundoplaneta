<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080719">
  <meta name="description" content="Fundo animado de Halloween do Planeta Reggae para xatframe.">
  <title>Planeta Reggae · Halloween</title>
  <link rel="stylesheet" href="style.css?v=5">
  <link rel="stylesheet" href="brand.css?v=5">
  <link rel="stylesheet" href="fog.css?v=5">
  <link rel="stylesheet" href="bats.css">
  <script defer src="effects.js?v=5"></script>
  <script defer src="bats.js"></script>
</head>
<body>
  <main class="backdrop">
    <div class="scene" aria-hidden="true"></div>
    <div class="night-shade" aria-hidden="true"></div>
    <div class="chat-clearance" aria-hidden="true"></div>
    <div class="moon-aura" aria-hidden="true"></div>
    <div class="pumpkin-glow pumpkin-glow--left" aria-hidden="true"></div>
    <div class="pumpkin-glow pumpkin-glow--right" aria-hidden="true"></div>

    <div id="night-specks" class="night-specks" aria-hidden="true"></div>

    <div id="flying-bats" class="flying-bats" aria-hidden="true"></div>

    <div class="fog fog--back" aria-hidden="true"></div>
    <div class="fog fog--front" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <header class="brand">
      <h1 aria-label="Planeta Reggae"><img class="brand-art" src="planeta-reggae-logo.svg" alt=""></h1>
    </header>
  </main>
</body>
</html>
